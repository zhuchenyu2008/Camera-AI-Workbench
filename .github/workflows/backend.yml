name: backend
on:
  push:
    paths: ['backend/**', 'docs/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'docs/**', '.github/workflows/backend.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.lock
      - run: ruff check app migrations scripts tests
      - run: ruff format --check app migrations scripts tests
      - run: pytest -q
      - run: python -m scripts.build_contracts --check
      - run: npx --yes --package typescript@5.9.3 tsc --noEmit --strict --lib ES2022,DOM contracts/api-types.ts
