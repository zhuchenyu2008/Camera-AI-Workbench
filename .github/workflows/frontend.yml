name: Frontend
on:
  push:
    paths: ['frontend/**', 'backend/contracts/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'backend/contracts/**', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          TZ: America/Los_Angeles
      - run: npm run build
