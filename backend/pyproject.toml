[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-ai-workbench"
version = "0.1.0"
description = "摄像头 AI 工作台后端"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.135.1", "pydantic==2.12.5", "SQLAlchemy==2.0.48",
  "alembic==1.20.0", "httpx==0.28.1", "cryptography==44.0.3",
  "Pillow==12.3.0", "numpy==2.4.6", "uvicorn==0.42.0",
  "python-multipart==0.0.32", "argon2-cffi==25.1.0", "tzdata==2026.4",
  "httpcore==1.0.9",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==0.26.0", "ruff==0.17.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
